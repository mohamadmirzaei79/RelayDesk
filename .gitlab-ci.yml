stages: [verify, package]
tests:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python -m unittest -v test_relay
gateway:
  stage: verify
  image: node:22-alpine
  script:
    - node --check gateway.mjs
    - node --check desk.js
chart:
  stage: verify
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  script:
    - helm lint chart
    - helm template relaydesk chart > /dev/null
images:
  stage: package
  image: docker:27-cli
  services: ["docker:27-dind"]
  variables: {DOCKER_HOST: "tcp://docker:2375", DOCKER_TLS_CERTDIR: ""}
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - 'for target in backend gateway; do image="$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_TAG"; docker build --target "$target" -t "$image" . && docker push "$image" || exit 1; done'
