name: relaydesk
x-api: &api
  build: {context: ., target: backend}
  environment: &env
    PGHOST: postgres
    PGDATABASE: relaydesk
    PGUSER: relay
    PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    RELAY_TOKEN: ${RELAY_TOKEN:?Set RELAY_TOKEN}
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: relaydesk, POSTGRES_USER: relay, POSTGRES_PASSWORD: "${PGPASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U relay -d relaydesk"], interval: 5s, timeout: 5s, retries: 20}
  mongo:
    image: mongo:7
    volumes: [mongodata:/data/db]
  init:
    <<: *api
    command: ["python","ledger.py"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    <<: *api
    depends_on: {init: {condition: service_completed_successfully}}
  gateway:
    build: {context: ., target: gateway}
    environment: {RELAY_TOKEN: "${RELAY_TOKEN}", API_URL: "http://api:8000"}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
  assistant:
    <<: *api
    environment: {API_URL: "http://api:8000", RELAY_TOKEN: "${RELAY_TOKEN}"}
    command: ["chainlit","run","handoff.py","-h","--host","0.0.0.0","--port","8001"]
    ports: ["127.0.0.1:8001:8001"]
    depends_on: [api]
  archive:
    <<: *api
    profiles: [jobs]
    environment: {<<: *env, MONGO_URL: "mongodb://mongo:27017"}
    command: ["python","archive.py"]
    depends_on: [api,mongo]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}"}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana-source.yml:/etc/grafana/provisioning/datasources/relay.yml:ro
      - ./grafana-provider.yml:/etc/grafana/provisioning/dashboards/relay.yml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/relay.json:ro
volumes: {pgdata: {}, mongodata: {}}
